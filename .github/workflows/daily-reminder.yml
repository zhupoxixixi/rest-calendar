name: Daily phone reminder
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check only; do not send phone notifications'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: daily-phone-reminder
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the public schedule active with a monthly marker
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, datetime, urllib.request, urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/automation-heartbeat'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          current=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m')+'\n'
          prior={}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as response: prior=json.load(response)
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          if prior and base64.b64decode(prior['content']).decode()==current: raise SystemExit(0)
          payload={'message':'Keep daily reminders active','content':base64.b64encode(current.encode()).decode()}
          if prior: payload['sha']=prior['sha']
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT'),timeout=20) as response: print('Monthly schedule marker saved:',response.status)
          PY
      - name: Send daily local calendar reminder
        env:
          CRON_TOKEN: ${{ secrets.REMINDER_CRON_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          key=os.environ['CRON_TOKEN']
          if not key: raise SystemExit('Missing reminder secret')
          req=urllib.request.Request('https://rest-calendar.earthyamber128.chatgpt.site/api/reminders',
              data=json.dumps({'dryRun':os.environ['DRY_RUN']=='true'}).encode(),
              headers={'Content-Type':'application/json','X-Reminder-Key':key},method='POST')
          with urllib.request.urlopen(req,timeout=240) as response:
              data=json.load(response)
          print(json.dumps(data,ensure_ascii=False))
          if data.get('failed'): raise SystemExit('Some push notifications failed')
          PY
